# Personal Info Scanner — example configuration.
# Copy to config.yaml and edit. Never commit your real config.yaml.

email:
  enabled: true
  # host/port/security are AUTO-DETECTED from your address — leave them blank.
  # Only fill host in if auto-detection fails for an unusual provider.
  host: ""
  port: 0                       # 0 = auto
  security: "ssl"               # ssl | starttls (auto-detected too)
  username: you@example.com
  # Prefer the PIS_EMAIL_PASSWORD env var over putting the password here.
  # For Gmail and most providers this must be an APP PASSWORD, not your login.
  password: ""
  # "ALL" scans every folder (inbox, sent, archive, spam, trash, All Mail).
  # Or name one folder, e.g. "INBOX" or "[Gmail]/All Mail".
  mailbox: "ALL"
  # Only look at mail newer than this many days (0 = everything, all time).
  since_days: 0
  # Safety cap so a first run can't take forever.
  max_messages: 50000

files:
  enabled: false
  # Directories to scan for personal info in local files.
  paths: []
  # File extensions to look inside (text-like formats only, by default).
  extensions: [".txt", ".md", ".csv", ".json", ".eml", ".log", ".rtf"]
  max_file_mb: 10

output:
  directory: "./inventory"
  # full | partial | redact  — how much of detected sensitive values to show.
  # 'full' shows everything exactly as found (passwords, keys, seed phrases).
  # The report then contains real secrets, so set encrypt_passphrase below or
  # delete the report when you're done.
  detail: "full"
  save_attachments: false
  # Set to a passphrase to encrypt the output bundle (requires `cryptography`).
  encrypt_passphrase: ""
